<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal productivity dashboard with a greeting, focus timer, to-do list, and quick links.">
    <title>Life Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="dashboard">
        <!-- Greeting Widget -->
        <section id="greeting" class="widget highlight">
            <h2 class="widget-title sr-only" style="display:none;">Greeting</h2>
            <div class="greeting-content">
                <p class="greeting-text">Hello</p>
                <div class="datetime">
                    <p class="time">--:--:--</p>
                    <p class="date"></p>
                </div>
            </div>
        </section>

        <!-- Focus Timer -->
        <section id="focus-timer" class="widget">
            <h2 class="widget-title">Focus Timer</h2>
            <p class="timer-display">25:00</p>
            <div class="timer-controls">
                <button type="button" class="btn-primary">Start</button>
                <button type="button" class="btn-secondary">Pause</button>
                <button type="button" class="btn-secondary">Reset</button>
            </div>
        </section>

        <!-- Tasks (To-Do List) -->
        <section id="todo-list" class="widget">
            <h2 class="widget-title">Task List</h2>
            <form class="todo-input-form" id="todo-form">
                <label for="todo-input" class="sr-only" style="display:none;">New task</label>
                <input type="text" id="todo-input" class="todo-input" maxlength="200" placeholder="Type a task and hit enter..." autocomplete="off">
                <button type="submit" class="btn-primary">+</button>
            </form>
            <div class="error-area">
                <p class="error-message" id="todo-error" role="alert"></p>
            </div>
            <ul class="task-list" id="task-list"></ul>
        </section>

        <!-- Quick Links -->
        <section id="quick-links" class="widget">
            <h2 class="widget-title">Bookmarks</h2>
            <form class="link-input-form" id="quick-links-form">
                <label for="link-name" class="sr-only" style="display:none;">Link name</label>
                <input type="text" id="link-name" class="link-name-input" placeholder="Name" autocomplete="off">
                
                <label for="link-url" class="sr-only" style="display:none;">URL</label>
                <input type="url" id="link-url" class="link-url-input" placeholder="https://" autocomplete="off">
                
                <button type="submit" class="btn-primary">Save</button>
            </form>
            <div class="error-area">
                <p class="error-message" id="quick-links-error" role="alert"></p>
            </div>
            <div class="link-buttons"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
